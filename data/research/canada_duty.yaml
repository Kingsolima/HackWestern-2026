# Canadian import duty for the AR4 club's lines (importing into Ontario).
# Duty = Customs Tariff MFN rate + any surtax order for the origin. HST is NOT duty: Ontario's
# 13% HST is collected by CBSA at import but is charged at the same rate on goods bought in
# Ontario, so it does not depend on where a part was made and is left out of the trade factor.
checked: 2026-11-22
tariff_schedule:
  edition: "Customs Tariff T2026, chapter 85 (effective 2026-01-01)"
  source_url: https://www.cbsa-asfc.gc.ca/trade-commerce/tariff-tarif/2026/01-99/ch85-2026-eng.pdf
hst:
  rate_pct: 13
  counts_as_duty: false
  source_url: https://canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-place-supply.html
  quote: "13% HST rate if the supply is made in the participating province of Ontario"
  import_source_url: https://cbsa.gc.ca/publications/dm-md/d2/d2-3-6-eng.pdf
  import_quote: "The Goods and Services Tax (GST) and HST on imported goods is collected by the Canada Border Services Agency (CBSA)"
