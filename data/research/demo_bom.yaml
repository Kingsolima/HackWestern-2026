# Demo robot BOM draft with sources (owner 3 research, checked 2026-11-21).
# Rules: every number has a source URL, a verbatim quote and a date. Missing = null + note.
# Tiers (suggested only; the verifier code decides):
#   T1 = origin stated on the model's own product page or a datasheet naming the model
#        (a distributor's per-SKU Country of Origin field is treated as T1, per docs/design/01)
#   T2 = company page naming a US plant for the product line
#   T3 = HQ address only or company-wide statement
#   rejected = "designed in" / marketing only;  none = nothing found
# Prices are qty-1 list prices in USD, before freight and duty.
# Quotes were copied from page text read with a browser or web extract; " | " in a quote
# marks a table-cell or line break in the rendered page.
robot:
  name: "Demo wheeled robot v3 (sourced draft)"
  final_assembly_country: "CA"
  mass_kg_target: 5.0
  note: "Baseline motor is integrated (motor + drive), so there is no separate motor-driver line."
date_checked: "2026-11-21"

bom:
  - part: "Drive motor (NEMA 23 integrated servo) - BASELINE"
    category: "motor"
    qty: 2
    product: {manufacturer: "STEPPERONLINE (OMC Corporation Ltd.)", model: "iSV57T-090S"}
    specs_quote: "Input Voltage: +20~50VDC(Typical 36VDC) | Rated Torque(Nm/oz.in): 0.3/42.49(Nm/oz.in) | Peak Torque(Nm/oz.in): 0.8/113.29(Nm/oz.in) | Rated Speed(rpm): 3000rpm"
    specs_note: "Meets 0.26 N*m continuous and 0.39 N*m peak on paper; 24 V is inside the 20-50 VDC range but below the 36 V typical, so check torque at 24 V and 160 rpm (no curve read). Shaft 8 mm, body 108 mm, frame 57 x 57 mm."
    unit_price_usd: 77.15
    price_source_url: "https://www.omc-stepperonline.com/nema-23-integrated-easy-servo-motor-90w-3000rpm-0-3nm-42-49oz-in-20-50vdc-servo-motor-short-shaft-isv57t-090s"
    price_quote: "iSV57T-090S | from | $77.15 | 5+ $74.51 | 10+ $72.05"
    price_note: "Price is for shipping from China. Same page: 'United States (+$12.58)' for the US warehouse (duties handled by seller)."
    origin_country: "CN"
    origin_source_url: "https://www.omc-stepperonline.com/about-us"
    origin_quote: "We own three manufacturing plants covering an area of 30,000m2 and cooperate with dozens of OEM factories"
    origin_quote_2: "collaborates with dozens of OEM factories in Changzhou and Shenzhen China"
    origin_note: "Company-wide statement, not model-specific. Product page only says 'Ships from | China'. Counts as foreign either way (unknown = foreign). Page renders 'm' with a superscript 2; quote ASCII-normalized."
    suggested_origin_tier: "T3"
    hts_code_guess: "8501.31.40"
    hts_source_url: "https://hts.usitc.gov/reststop/search?keyword=8501.31.40"
    hts_quote: "'htsno': '8501.31.40.00', 'description': 'Exceeding <il>74.6 W</il> but not exceeding <il>735 W</il>', 'general': '4%'"
    hts_note: "Guess: DC motor 90 W. An integrated motor+drive could be argued elsewhere; ask a broker. 8501.31.40 is on Section 301 List 2 (see tariffs.yaml)."
    supply_risk: ["ndfeb_magnets (PM servo rotor; China export-licence regime, docs/design/02 C.1)", "single_vendor_marketplace"]
    date_checked: "2026-11-21"

  - part: "Drive motor (NEMA 23 integrated servo) - US SWAP"
    category: "motor"
    qty: 2
    swap_for: "Drive motor (NEMA 23 integrated servo) - BASELINE"
    product: {manufacturer: "Teknic, Inc.", model: "CPM-SDSK-2310S-RLN (ClearPath-SDSK)"}
    specs_quote: "Peak Torque | 223 oz-in | Cont. (RMS) Torque | 45 oz-in | Max Speed | 4,000 RPM"
    specs_note: "Values shown at 75 VDC on the page; 45 oz-in = 0.318 N*m continuous. Page lists 'Input (bus) Voltage Range 24-75 VDC (90 VDC max)'. Torque at 24 V needs the JS curve (HANDOFF-v3 2.3). Default shaft 0.375 in (9.52 mm); a 0.25 in (6.35 mm) option exists."
    unit_price_usd: 265.00
    price_source_url: "https://teknic.com/model-info/CPM-SDSK-2310S-RLN/"
    price_quote: "Motor Pricing | Qty: 1-9 10-49 50-99 100-199 200+ | $265"
    price_note: "Page is JavaScript-rendered; read with a browser on 2026-11-21. A reseller lists it at $332.95 (vbindustrialsupply.com), not used."
    origin_country: "US"
    origin_source_url: "https://teknic.com/model-info/CPM-SDSK-2310S-RLN/"
    origin_quote: "Country of Origin USA"
    origin_note: "Stated on the model's own page, so T1 (HANDOFF-v3 had T2 from the line page's 'New York manufacturing plant')."
    suggested_origin_tier: "T1"
    hts_code_guess: "8501.31.40"
    hts_source_url: "https://hts.usitc.gov/reststop/search?keyword=8501.31.40"
    hts_quote: "'general': '4%'"
    hts_note: "Not imported (US-made), so no US duty. Canadian counter-tariffs may apply if the parts are shipped into Canada for assembly (docs/design/02 D); not researched."
    supply_risk: ["ndfeb_magnets inside motor (one level down: does not change domestic status, disclose only)", "sole_source"]
    date_checked: "2026-11-21"

