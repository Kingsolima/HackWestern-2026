    price_note: "Memory-driven price rises in 2026 (raspberrypi.com/news/more-memory-driven-price-rises). Adafruit lists '4GB RAM$130.00'. Mouser category snippet also showed $110.00 but Mouser blocked the page (Access Denied)."
    origin_country: "GB"
    origin_source_url: "https://www.berrybase.de/en/raspberry-pi-5-4gb-ram"
    origin_quote: "Zolltarifnummer: | 84715000 | ... | Country of Origin: | Great Britain"
    origin_source_url_2: "https://raspberrypi.dk/en/product/raspberry-pi-5-4-gb"
    origin_quote_2: "Manufacturer Product Number | SC1111 | Brand | Raspberry Pi | Country of Origin | GB | HS Tariff Code | 8471500000"
    origin_conflict: "Amazon.de listing for the same SC1111 says 'Country of Origin: China' and an Indian reseller says Japan (search snippets only). Origin may vary by batch; ask the distributor for a COO declaration per lot."
    suggested_origin_tier: "T1"
    hts_code_guess: "8471.50.01"
    hts_source_url: "https://hts.usitc.gov/reststop/search?keyword=8471.50.01"
    hts_quote: "'htsno': '8471.50.01', 'description': 'Processing units other than those of subheading 8471.41 or 8471.49 ...', 'general': 'Free'"
