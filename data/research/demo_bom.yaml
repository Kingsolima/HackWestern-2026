    origin_country: "CN"
    origin_source_url: "https://botland.store/laser-scanners-lidar/19625-rplidar-a1m8-r6-360-degree-laser-scanner-kit-12m-range-seeedstudio-114992561-5904422369248.html"
    origin_quote: "GPSR data | Country of origin | **China**"
    origin_note: "EU distributor per-SKU GPSR field for the A1M8-R6 kit. Indian resellers also state 'Country of Origin: China' with Slamtec's Shanghai address (search snippets)."
    suggested_origin_tier: "T1"
    hts_code_guess: "9031.80.80"
    hts_source_url: "https://hts.usitc.gov/reststop/file?release=currentRelease&filename=Chapter%2099"
    hts_quote: null
    hts_note: "Low-confidence guess (measuring instrument nesoi). Alternative 9015.80.80. Both are on Section 301 List 1 per HTS Rev. 23 Chapter 99 note 20(b). We did not find a CBP ruling for this lidar; ask a broker."
    supply_risk: ["no verified US-made 2D lidar found in this pass", "Slamtec not on 1260H (Hesai and RoboSense are)"]
    date_checked: "2026-11-21"

