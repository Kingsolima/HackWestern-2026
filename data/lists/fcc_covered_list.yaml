# FCC Covered List (47 CFR 1.50002). Entries copied from the FCC page on 2026-11-21.
# Quotes are verbatim except footnote symbols, which were dropped (ASCII only).
list: "FCC Covered List"
official_url: "https://www.fcc.gov/supplychain/coveredlist"
list_version_on_page: "(November 18, 2026)"
conditional_approvals_updated: "(Updated November 18, 2026)"
faq_url: "https://www.fcc.gov/covered-list-faqs-robots-inverters"
date_checked: "2026-11-21"
effect_quote: "Equipment on the Covered List (\"covered equipment\") is prohibited from getting FCC equipment authorization."
effect_source_url: "https://www.fcc.gov/covered-list-faqs-robots-inverters"

# Category entries (apply to any producer that meets the description)
categories:
  - entry: "Foreign-produced advanced robotic devices, except advanced robotic devices which have been granted a Conditional Approval by DoW."
    date_of_inclusion: "July 28, 2026"
    relevant_to_demo_robot: true
  - entry: "Foreign-produced power inverters, except power inverters which have been granted a Conditional Approval by DoW or DHS."
    date_of_inclusion: "July 28, 2026; Updated: August 20, 2026"
    relevant_to_demo_robot: false
    note: "Defined as utility-interactive (grid-tied) DC-to-AC inverters (UL 1741). Our robot has no grid-tied inverter; the motor drives are not this."
  - entry: "Routers produced in a foreign country, except routers which have been granted a Conditional Approval by DoW or DHS."
    date_of_inclusion: "March 23, 2026"
    relevant_to_demo_robot: false
    note: "Only if we ship a stand-alone router. The Raspberry Pi 5 Wi-Fi is not a router product."
  - entry: "Uncrewed aircraft systems (UAS) and UAS critical components produced in a foreign country (with exceptions for the DCMA Blue UAS Cleared List and domestic end products until January 1, 2028, and Conditional Approvals)"
    date_of_inclusion: "see page (text truncated in our extract)"
    relevant_to_demo_robot: false
    note: "Paraphrase of a long entry; read the page for the exact wording. Ground robots are excluded from 'advanced robotic device' if they are UAS, and vice versa."

