  - "The Deputy Secretary of Defense has determined that the following previously listed entities should be removed from the most recent Section 1260H List announced on January 7, 2025:"
  - "The list of entities designated as ``Chinese military companies'' in Mandarin can be found in this notice's docket on https://www.regulations.gov. Search by the docket ID, DOD-2026-OS-1288. The Mandarin list is available for public viewing at the Supporting & Related Material tab. Reconsideration Process Entities who are included on the 1260H List may request reconsideration of this decision. Requests for reconsideration must include: 1. The listed entity's name and mailing address (including email address) and an authorized representative's name and mailing address (including email address); and 2. A statement indicating the entity's intent to request reconsideration of the Department's determination, including a detailed description with supporting evidence of why the listed entity should be removed from the 1260H List. The request for reconsideration may also include additional information such as arguments and evidence that establishes that an insufficient basis exists for the listing or that the circumstances resulting in the listing no longer apply. Requests for reconsideration or any other correspondence related to the 1260H List must be emailed to [email protected]."
